name: pages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      IBM_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Wait for successful release workflow for this tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY ?? "";
          const sha = process.env.GITHUB_SHA ?? "";
          const tag = process.env.GITHUB_REF_NAME ?? "";
          const token = process.env.GITHUB_TOKEN ?? "";
          const tagLabel = tag || "<unknown-tag>";

          const missingContext = [
            repository ? null : "GITHUB_REPOSITORY",
            sha ? null : "GITHUB_SHA",
            token ? null : "GITHUB_TOKEN",
          ].filter(Boolean);
          if (missingContext.length > 0) {
            throw new Error(
              `Missing required GitHub Actions context: ${missingContext.join(", ")}.`,
            );
          }

          const [owner, repo] = repository.split("/");
          const timeoutMs = 20 * 60 * 1000;
          const pollMs = 10 * 1000;
          const deadline = Date.now() + timeoutMs;
          const url = new URL(
            `https://api.github.com/repos/${owner}/${repo}/actions/workflows/release.yml/runs`,
          );
          url.searchParams.set("event", "push");
          url.searchParams.set("per_page", "100");
          const parseRunTime = (value) => {
            const parsed = Date.parse(value ?? "");
            return Number.isNaN(parsed) ? 0 : parsed;
          };

          while (true) {
            if (Date.now() > deadline) {
              throw new Error(
                `Timed out waiting for release workflow completion for tag ${tagLabel} at ${sha}.`,
              );
            }

            const response = await fetch(url, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: "Bearer " + token,
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            if (!response.ok) {
              throw new Error(`Failed to list release workflow runs (${response.status}).`);
            }

            const payload = await response.json();
            const runs = (payload.workflow_runs ?? [])
              .filter((run) => run.head_sha === sha)
              .slice()
              .sort((left, right) => {
                const leftTime = parseRunTime(left.run_started_at ?? left.created_at);
                const rightTime = parseRunTime(right.run_started_at ?? right.created_at);
                return rightTime - leftTime;
              });
            if (runs.length === 0) {
              await new Promise((resolve) => setTimeout(resolve, pollMs));
              continue;
            }

            const releaseRun = runs[0];
            if (releaseRun.status !== "completed") {
              await new Promise((resolve) => setTimeout(resolve, pollMs));
              continue;
            }

            if (releaseRun.conclusion !== "success") {
              throw new Error(
                `Release workflow ${releaseRun.id} for tag ${tagLabel} concluded ${releaseRun.conclusion}.`,
              );
            }

            break;
          }
          NODE
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - name: Stage specimen
        run: |
          mkdir _site
          cp docs/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    if: ${{ !contains(github.ref_name, '-') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
