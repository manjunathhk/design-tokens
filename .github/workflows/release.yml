name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IBM_TELEMETRY_DISABLED: "true"
  R2_BUCKET: mk-design-cdn
  CDN_BASE_URL: https://design.manjunathhk.in

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Validate release context
        id: meta
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            echo "Tag must start with v." >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $VERSION does not match package.json version $PACKAGE_VERSION." >&2
            exit 1
          fi

          git fetch --no-tags origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Tag commit must be on main (D14)." >&2
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run api-diff
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e

      - name: Build upload manifest
        run: |
          npx tsx scripts/upload-manifest.ts --version "${{ steps.meta.outputs.version }}" > /tmp/upload-manifest.json

      - name: Upload pinned prefix to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "::add-mask::$R2_ENDPOINT"

          # shellcheck disable=SC2016 # backticks are a JMESPath array literal, not command substitution
          existing_count="$(aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --prefix "v${{ steps.meta.outputs.version }}/" \
            --max-items 1 \
            --query 'length(Contents || `[]`)' \
            --output text \
            --endpoint-url "$R2_ENDPOINT")"
          if [[ "$existing_count" != "0" ]]; then
            echo "Pinned prefix v${{ steps.meta.outputs.version }}/ already exists; refusing overwrite." >&2
            exit 1
          fi

          node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for (const e of m.entries) console.log([e.path,e.pinnedKey,e.contentType,e.pinnedCacheControl].join("\t"));' /tmp/upload-manifest.json > /tmp/pinned.tsv
          while IFS=$'\t' read -r path key content_type cache_control; do
            aws s3 cp "dist/$path" "s3://$R2_BUCKET/$key" \
              --content-type "$content_type" \
              --cache-control "$cache_control" \
              --endpoint-url "$R2_ENDPOINT"
          done < /tmp/pinned.tsv

      - name: Verify pinned CDN assets
        run: |
          node --input-type=module <<'NODE' "/tmp/upload-manifest.json" "${CDN_BASE_URL}" "v${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.version }}"
          import { readFileSync } from "node:fs";

          const [manifestPath, baseUrl, prefix, version] = process.argv.slice(2);
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          const banner = `/*! @manjunathhk/design-tokens v${version} */`;
          let checkedFontCors = false;

          for (const entry of manifest.entries) {
            const url = `${baseUrl}/${prefix}/${entry.path}`;
            const headers = entry.path.endsWith(".woff2")
              ? { Origin: "https://example.com" }
              : undefined;
            const response = await fetch(url, { headers });
            if (response.status !== 200) {
              throw new Error(`${url} returned ${response.status}, expected 200.`);
            }
            const contentType = (response.headers.get("content-type") ?? "").toLowerCase();
            if (!contentType.startsWith(entry.contentType.toLowerCase())) {
              throw new Error(
                `${url} returned Content-Type ${contentType || "<missing>"}, expected ${entry.contentType}.`,
              );
            }

            if (entry.path === "index.css") {
              const body = await response.text();
              if (!body.includes(banner)) {
                throw new Error(`${url} is missing banner ${banner}.`);
              }
            }

            if (!checkedFontCors && entry.path.endsWith(".woff2")) {
              checkedFontCors = true;
              const origin = response.headers.get("access-control-allow-origin");
              if (!origin) {
                throw new Error(`${url} is missing Access-Control-Allow-Origin for font CORS.`);
              }
            }
          }

          if (!checkedFontCors) {
            throw new Error("Manifest has no .woff2 entry to verify CORS.");
          }
          NODE

      - name: Publish release candidate to npm (next tag)
        if: ${{ steps.meta.outputs.is_rc == 'true' }}
        run: npm publish --tag next

      - name: Promote pinned to alias prefix
        if: ${{ steps.meta.outputs.is_rc != 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "::add-mask::$R2_ENDPOINT"

          node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for (const e of m.entries) console.log([e.pinnedKey,e.aliasKey,e.contentType,e.aliasCacheControl].join("\t"));' /tmp/upload-manifest.json > /tmp/promote.tsv
          while IFS=$'\t' read -r from_key to_key content_type cache_control; do
            aws s3 cp "s3://$R2_BUCKET/$from_key" "s3://$R2_BUCKET/$to_key" \
              --copy-props none \
              --metadata-directive REPLACE \
              --content-type "$content_type" \
              --cache-control "$cache_control" \
              --endpoint-url "$R2_ENDPOINT"
          done < /tmp/promote.tsv

      - name: Purge alias URLs in Cloudflare cache
        if: ${{ steps.meta.outputs.is_rc != 'true' }}
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const base=process.argv[2];const major=process.argv[3];const urls=m.entries.map((e)=>base + "/v" + major + "/" + e.path);fs.writeFileSync("/tmp/purge-body.json",JSON.stringify({files:urls}));' /tmp/upload-manifest.json "$CDN_BASE_URL" "${{ steps.meta.outputs.major }}"

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const response = await fetch(
            `https://api.cloudflare.com/client/v4/zones/${process.env.CF_ZONE_ID ?? ""}/purge_cache`,
            {
              method: "POST",
              headers: {
                Authorization: "Bearer " + (process.env.CF_API_TOKEN ?? ""),
                "Content-Type": "application/json",
              },
              body: readFileSync("/tmp/purge-body.json", "utf8"),
            },
          );
          const raw = await response.text();
          if (!response.ok) {
            throw new Error(`Cloudflare purge request failed with ${response.status}: ${raw}`);
          }
          const body = JSON.parse(raw);
          if (!body.success) {
            throw new Error(`Cloudflare purge failed: ${JSON.stringify(body.errors ?? body)}`);
          }
          writeFileSync("/tmp/purge-response.json", raw);
          NODE

      - name: Verify alias CDN assets
        if: ${{ steps.meta.outputs.is_rc != 'true' }}
        run: |
          node --input-type=module <<'NODE' "/tmp/upload-manifest.json" "${CDN_BASE_URL}" "v${{ steps.meta.outputs.major }}" "${{ steps.meta.outputs.version }}"
          import { readFileSync } from "node:fs";

          const [manifestPath, baseUrl, prefix, version] = process.argv.slice(2);
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          const banner = `/*! @manjunathhk/design-tokens v${version} */`;
          let checkedFontCors = false;

          for (const entry of manifest.entries) {
            const url = `${baseUrl}/${prefix}/${entry.path}`;
            const headers = entry.path.endsWith(".woff2")
              ? { Origin: "https://example.com" }
              : undefined;
            const response = await fetch(url, { headers });
            if (response.status !== 200) {
              throw new Error(`${url} returned ${response.status}, expected 200.`);
            }
            const contentType = (response.headers.get("content-type") ?? "").toLowerCase();
            if (!contentType.startsWith(entry.contentType.toLowerCase())) {
              throw new Error(
                `${url} returned Content-Type ${contentType || "<missing>"}, expected ${entry.contentType}.`,
              );
            }

            if (entry.path === "index.css") {
              const body = await response.text();
              if (!body.includes(banner)) {
                throw new Error(`${url} is missing banner ${banner}.`);
              }
            }

            if (!checkedFontCors && entry.path.endsWith(".woff2")) {
              checkedFontCors = true;
              const origin = response.headers.get("access-control-allow-origin");
              if (!origin) {
                throw new Error(`${url} is missing Access-Control-Allow-Origin for font CORS.`);
              }
            }
          }

          if (!checkedFontCors) {
            throw new Error("Manifest has no .woff2 entry to verify CORS.");
          }
          NODE

      - name: Publish final release to npm
        if: ${{ steps.meta.outputs.is_rc != 'true' }}
        run: npm publish

      - name: Build GitHub Release notes from CHANGELOG
        if: ${{ steps.meta.outputs.is_rc != 'true' }}
        run: |
          node --input-type=module <<'NODE' "${{ steps.meta.outputs.version }}"
          import { readFileSync, writeFileSync } from "node:fs";

          const version = process.argv[2];
          const changelog = readFileSync("CHANGELOG.md", "utf8");
          const lines = changelog.split("\n");
          const sectionHeading = `## [${version}]`;
          const start = lines.findIndex((line) => line.startsWith(sectionHeading));
          if (start < 0) {
            throw new Error(`CHANGELOG.md is missing section ## [${version}] with release notes.`);
          }
          let end = lines.length;
          for (let index = start + 1; index < lines.length; index += 1) {
            if (lines[index]?.startsWith("## [")) {
              end = index;
              break;
            }
          }
          const notes = lines
            .slice(start + 1, end)
            .join("\n")
            .trim();
          if (!notes) {
            throw new Error(`CHANGELOG.md section ## [${version}] has no release notes.`);
          }
          writeFileSync("/tmp/release-notes.md", notes + "\n");
          NODE

      - name: Create GitHub Release
        if: ${{ steps.meta.outputs.is_rc != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
