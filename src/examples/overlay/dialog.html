<dialog class="ex-dialog" open aria-labelledby="ex-dialog-title">
  <form class="ex-dialog-body" method="dialog">
    <h2 class="ex-dialog-title" id="ex-dialog-title">Delete this draft?</h2>
    <p class="ex-dialog-text">The draft and its notes are removed. This cannot be undone.</p>
    <div class="ex-dialog-actions">
      <button class="ex-button" value="cancel">Keep draft</button>
      <button class="ex-button ex-button-danger-solid" value="delete">Delete draft</button>
    </div>
  </form>
</dialog>
