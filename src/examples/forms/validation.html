<div class="ex-form">
  <div class="ex-field">
    <label class="ex-label" for="ex-username">Username</label>
    <input
      class="ex-input"
      id="ex-username"
      value="mk"
      aria-invalid="true"
      aria-describedby="ex-username-error"
    />
    <p class="ex-message ex-message-error" id="ex-username-error">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v6M12 17h.01" />
      </svg>
      Use at least 3 characters.
    </p>
  </div>
  <div class="ex-field">
    <label class="ex-label" for="ex-handle">Handle</label>
    <input
      class="ex-input ex-is-valid"
      id="ex-handle"
      value="manjunathhk"
      aria-describedby="ex-handle-ok"
    />
    <p class="ex-message ex-message-success" id="ex-handle-ok">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M5 12l5 5 9-10" />
      </svg>
      Available.
    </p>
  </div>
</div>
