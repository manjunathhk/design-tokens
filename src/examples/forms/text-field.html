<div class="ex-form">
  <div class="ex-field">
    <label class="ex-label" for="ex-name">Full name</label>
    <input class="ex-input" id="ex-name" name="name" autocomplete="name" />
  </div>
  <div class="ex-field">
    <label class="ex-label" for="ex-email">Email</label>
    <input
      class="ex-input"
      id="ex-email"
      name="email"
      type="email"
      placeholder="you@example.com"
      aria-describedby="ex-email-help"
    />
    <p class="ex-help" id="ex-email-help">Only used to reply to you.</p>
  </div>
  <div class="ex-field">
    <label class="ex-label" for="ex-site"
      >Website <span class="ex-optional">(optional)</span></label
    >
    <input class="ex-input" id="ex-site" name="site" type="url" placeholder="https://" />
  </div>
</div>
