<div class="ex-form">
  <div class="ex-field">
    <label class="ex-label" for="ex-topic">Topic</label>
    <select class="ex-select" id="ex-topic">
      <option>General question</option>
      <option>Project enquiry</option>
      <option>Speaking</option>
    </select>
  </div>
  <div class="ex-field">
    <label class="ex-label" for="ex-message">Message</label>
    <textarea
      class="ex-textarea"
      id="ex-message"
      placeholder="What would you like to talk about?"
    ></textarea>
  </div>
</div>
