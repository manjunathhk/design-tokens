<div class="ex-field">
  <label class="ex-label" for="ex-speed">Reading speed</label>
  <input
    class="ex-range"
    id="ex-speed"
    type="range"
    min="0"
    max="100"
    value="60"
    aria-describedby="ex-speed-value"
  />
  <output class="ex-output" id="ex-speed-value" for="ex-speed">60 percent</output>
</div>
